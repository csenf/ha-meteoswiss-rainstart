# Test on every push/PR. Deploy runs from release.yml on tag push (not on main).
# Gitea does not run ci-tag-release.sh — public tags come from GitHub / Promote workflow.
name: CI / Test
run-name: ${{ gitea.event.head_commit.message }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" -q

      - name: Run frontend card model tests
        run: node --test tests/frontend/test_rainstart_card_model.mjs

      - name: Checkout ansible control plane
        if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.ANSIBLE_CONTROL_REPOSITORY }}
          ref: master
          path: control-plane
          token: ${{ secrets.ANSIBLE_REPO_TOKEN }}

      - name: Shell syntax check
        run: |
          bash -n scripts/ci-tag-release.sh
          bash -n scripts/deploy.sh
          bash -n scripts/stamp-version.sh
          bash -n scripts/dev-version.sh
          bash -n scripts/promote-to-github.sh
          bash -n scripts/reachable-semver-tags.sh
          bash -n scripts/sync-from-github.sh
          bash -n scripts/wait-for-github.sh
          bash -n scripts/ansible-deploy.sh
          bash -n scripts/_ansible_common.sh
