# Test on every push/PR. Do not tag or create GitHub Releases here.
# Optional: set ANSIBLE_DISPATCH_URL and ANSIBLE_REPO_TOKEN to deploy
# the Gitea checkout via Ansible after tests on main.
name: CI / Test
run-name: ${{ gitea.event.head_commit.message }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" -q

      - name: Shell syntax check
        run: |
          bash -n scripts/ci-tag-release.sh
          bash -n scripts/deploy.sh
          bash -n scripts/stamp-version.sh
          bash -n scripts/dev-version.sh

  dispatch-ansible:
    name: Dispatch Ansible deploy
    runs-on: ubuntu-latest
    needs: test
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    steps:
      - name: Trigger Ansible if secrets are set
        env:
          ANSIBLE_DISPATCH_URL: ${{ secrets.ANSIBLE_DISPATCH_URL }}
          ANSIBLE_REPO_TOKEN: ${{ secrets.ANSIBLE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANSIBLE_DISPATCH_URL}" ] || [ -z "${ANSIBLE_REPO_TOKEN}" ]; then
            echo "Ansible dispatch secrets not set; skip."
            exit 0
          fi
          http_code=$(curl -s -o /tmp/deploy-response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: token ${ANSIBLE_REPO_TOKEN}" \
            "${ANSIBLE_DISPATCH_URL}" \
            -d '{"ref":"master","inputs":{"app":"ha-meteoswiss-rainstart","containerState":"started"}}')
          echo "HTTP ${http_code}"
          test "${http_code}" = "204" -o "${http_code}" = "200"
