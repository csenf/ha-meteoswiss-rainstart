---
# Manual redeploy of a tagged release. Checks out v<version> when provided.
name: Deploy via Ansible (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver tag to deploy (e.g. 0.10.0 or v0.10.0). Leave empty to deploy the current branch.
        required: false
        type: string
        default: ''

jobs:
  deploy:
    uses: ./.gitea/workflows/deploy.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
