# Push Gitea main to GitHub over SSH. Secret GH_DEPLOY_KEY is a write-enabled
# GitHub deploy private key (does not expire). GitHub Actions then stamps,
# tags, and creates the Release.
name: Promote to GitHub
on:
  workflow_dispatch:

jobs:
  promote:
    name: Push main to GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main and SemVer tags reachable from HEAD
        env:
          GH_DEPLOY_KEY: ${{ secrets.GH_DEPLOY_KEY }}
        run: bash scripts/promote-to-github.sh
