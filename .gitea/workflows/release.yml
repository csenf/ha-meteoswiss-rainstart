name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" -q

      - name: Run frontend card model tests
        run: node --test tests/frontend/test_rainstart_card_model.mjs

  deploy:
    name: Deploy via Ansible
    needs: release
    uses: ./.gitea/workflows/deploy.yml
    secrets: inherit
    with:
      version: ${{ gitea.ref_name }}
