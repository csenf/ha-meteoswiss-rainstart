# Test on every push/PR. On main: stamp manifest.json, SemVer tag, and
# publish a GitHub Release (HACS uses the release; HA reads the stamp).
name: CI / Test & Tag
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Manual run on {0}', github.ref_name) || github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" -q

      - name: Run frontend card model tests
        run: node --test tests/frontend/test_rainstart_card_model.mjs

      - name: Shell syntax check
        run: |
          bash -n scripts/ci-tag-release.sh
          bash -n scripts/deploy.sh
          bash -n scripts/stamp-version.sh
          bash -n scripts/dev-version.sh
          bash -n scripts/promote-to-github.sh
          bash -n scripts/reachable-semver-tags.sh
          bash -n scripts/sync-from-github.sh
          bash -n scripts/wait-for-github.sh

  tag:
    name: Tag release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp manifest, tag, and push
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/ci-tag-release.sh | tee /tmp/release.out
          grep '^VERSION=' /tmp/release.out >> "$GITHUB_OUTPUT"
          grep '^RELEASED=' /tmp/release.out >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.version.outputs.RELEASED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.VERSION }}" --title "v${{ steps.version.outputs.VERSION }}" --generate-notes
