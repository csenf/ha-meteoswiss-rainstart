---
# Home Assistant config path on the target host (HA OS default).
meteoswiss_rainstart_install_dir: /config/custom_components/meteoswiss_rainstart
# Optional semver override (CI may pass -e meteoswiss_rainstart_version=X.Y.Z).
meteoswiss_rainstart_version: ""
# App checkout root (CI and ansible-deploy.sh pass -e meteoswiss_rainstart_repo_root=…).
meteoswiss_rainstart_repo_root: "{{ role_path }}/../../.."
meteoswiss_rainstart_component_src: >-
  {{ meteoswiss_rainstart_repo_root }}/custom_components/meteoswiss_rainstart
meteoswiss_rainstart_rsync_opts:
  - "--exclude=__pycache__/"
  - "--exclude=*.pyc"
# Empty string skips restart (useful for dry runs).
meteoswiss_rainstart_ha_restart_command: ha core restart
